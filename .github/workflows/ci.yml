name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Lua 5.1
        uses: leafo/gh-actions-lua@v10
        with:
          luaVersion: "5.1"

      - name: Set up LuaRocks
        uses: leafo/gh-actions-luarocks@v4

      - name: Install Luacheck and Busted
        run: |
          luarocks install luacheck
          luarocks install busted

      # Lint/format only tracked source — the Lua/LuaRocks install lands in the
      # workspace and must not be scanned.
      - name: Luacheck
        run: luacheck $(git ls-files '*.lua')

      - name: Busted
        run: busted

      - name: StyLua
        uses: JohnnyMorganz/stylua-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: v2.5.2
          args: --check Applier.lua Capture.lua Core.lua Database.lua Defaults.lua Events.lua Resolver.lua SlashCommands.lua Data UI Util spec
